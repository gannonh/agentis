name: core

on:
  push:
  pull_request:

jobs:
  linux:
    name: linux-x64 Node 24.20.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm pack:smoke
      - run: node --test .agents/skills/verify-agentis/helpers/smoke-ownership.test.mjs docs/verification/kat-3247/audit-evidence.test.mjs

  exclusions:
    name: report platform exclusions
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat <<'EOF'
          Core CI matrix: ubuntu-latest linux-x64, Node 24.20.0.
          Excluded: macOS Apple silicon (primary target; separate manual Gate 0 evidence).
          Excluded: Windows.
          Packaged fake-fixture Docker isolation is exercised by pack:smoke.
          Live-provider Docker Desktop Run-container enforcement is not exercised in this matrix.
          EOF
